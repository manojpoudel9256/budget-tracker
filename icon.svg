<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="0" ry="0" fill="url(#bg)"/>
  <!-- Wallet Icon -->
  <g transform="translate(256, 240)" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wallet body -->
    <rect x="-120" y="-80" width="240" height="160" rx="24" fill="none"/>
    <!-- Wallet flap -->
    <path d="M-120,-80 L-120,-100 C-120,-120 -100,-140 -80,-140 L60,-140 C80,-140 90,-130 100,-110 L120,-80"/>
    <!-- Card slot / clasp -->
    <circle cx="90" cy="10" r="16" fill="white" stroke="none"/>
  </g>
  <!-- App name hint: small yen symbol -->
  <text x="256" y="380" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="48" font-weight="bold">¥</text>
</svg>
